name = "api"
main = "src/worker.ts"
compatibility_date = "2024-12-16"

[[env.production.env]]
SUPABASE_URL = ""
SUPABASE_ANON_KEY = ""
STRIPE_SECRET_KEY = ""
JWT_SECRET = ""

[env.production]
name = "sixtysevenai-prod"
routes = [
  { pattern = "api/*", zone_id = "your_zone_id" }
]

[env.staging]
name = "sixtysevenai-staging"
routes = [
  { pattern = "staging-api/*", zone_id = "your_zone_id" }
]

[build]
command = "npm run build"
cwd = "./"

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "sixtysevenai-uploads"
